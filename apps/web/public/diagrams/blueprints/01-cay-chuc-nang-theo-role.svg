<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="MINDMAP" style="width:1414px;height:984px;background:#FBFAF6;" width="1414px" height="984px" viewBox="0 0 1414 984" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="1414" height="984" fill="#FBFAF6" style="stroke:none;"/><rect x="595.43" y="464.601" width="257.832" height="54.497" fill="#15352B" style="stroke:#181818;stroke-width:1.5;" rx="12.5" ry="12.5"/><text x="605.43" y="488.671" fill="#FFF" font-size="15" textLength="33.34" font-weight="700" font-family="Arial">GÓP</text><text x="605.43" y="505.919" fill="#FFF" font-size="15" textLength="237.832" font-family="Arial">CÂY CHỨC NĂNG THEO VAI TRÒ</text><rect x="903.262" y="91.746" width="71.672" height="37.249" fill="#E7F0F6" style="stroke:#181818;stroke-width:1.5;" rx="12.5" ry="12.5"/><text x="913.262" y="115.815" fill="#000" font-size="15" textLength="51.672" font-weight="700" font-family="Arial">GUEST</text><rect x="1024.934" y="20" width="265.859" height="88.994" fill="#FFF" style="stroke:#181818;stroke-width:1.5;" rx="12.5" ry="12.5"/><text x="1034.934" y="44.07" fill="#000" font-size="15" textLength="245.859" font-weight="700" font-family="Arial">KHÁM PHÁ CÔNG KHAI - G01-G03</text><text x="1034.934" y="61.318" fill="#000" font-size="15" textLength="217.881" font-family="Arial">• Trang chủ và chiến dịch nổi bật</text><text x="1034.934" y="78.567" fill="#000" font-size="15" textLength="201.152" font-family="Arial">• Tìm kiếm, category và bộ lọc</text><text x="1034.934" y="95.815" fill="#000" font-size="15" textLength="157.002" font-family="Arial">• Project Detail đủ 7 tab</text><path d="M974.934,110.37 L984.934,110.37 C999.934,110.37 999.934,64.497 1014.934,64.497 L1024.934,64.497" style="stroke:#5A6C64;stroke-width:1;" fill="none"/><rect x="1024.934" y="128.994" width="315.452" height="71.746" fill="#FFF" style="stroke:#181818;stroke-width:1.5;" rx="12.5" ry="12.5"/><text x="1034.934" y="153.064" fill="#000" font-size="15" textLength="158.357" font-weight="700" font-family="Arial">TÀI KHOẢN - G04-G05</text><text x="1034.934" y="170.313" fill="#000" font-size="15" textLength="180.33" font-family="Arial">• Đăng ký Backer mặc định</text><text x="1034.934" y="187.561" fill="#000" font-size="15" textLength="295.452" font-family="Arial">• Đăng nhập, đăng xuất, khôi phục mật khẩu</text><path d="M974.934,110.37 L984.934,110.37 C999.934,110.37 999.934,164.867 1014.934,164.867 L1024.934,164.867" style="stroke:#5A6C64;stroke-width:1;" fill="none"/><path d="M853.262,491.849 L863.262,491.849 C878.262,491.849 878.262,110.37 893.262,110.37 L903.262,110.37" style="stroke:#5A6C64;stroke-width:1;" fill="none"/><rect x="903.262" y="355.607" width="84.167" height="37.249" fill="#E8F1D8" style="stroke:#181818;stroke-width:1.5;" rx="12.5" ry="12.5"/><text x="913.262" y="379.677" fill="#000" font-size="15" textLength="64.167" font-weight="700" font-family="Arial">BACKER</text><rect x="1037.429" y="220.74" width="310.361" height="88.994" fill="#FFF" style="stroke:#181818;stroke-width:1.5;" rx="12.5" ry="12.5"/><text x="1047.429" y="244.81" fill="#000" font-size="15" textLength="180.022" font-weight="700" font-family="Arial">CÁ NHÂN HÓA - B01-B05</text><text x="1047.429" y="262.058" fill="#000" font-size="15" textLength="206.045" font-family="Arial">• Chọn sở thích lúc onboarding</text><text x="1047.429" y="279.307" fill="#000" font-size="15" textLength="268.711" font-family="Arial">• Nhận Top-N Recommendation có lý do</text><text x="1047.429" y="296.555" fill="#000" font-size="15" textLength="290.361" font-family="Arial">• Save campaign, Follow Creator, Notify me</text><path d="M987.429,374.231 L997.429,374.231 C1012.429,374.231 1012.429,265.237 1027.429,265.237 L1037.429,265.237" style="stroke:#5A6C64;stroke-width:1;" fill="none"/><rect x="1037.429" y="329.734" width="259.546" height="88.994" fill="#FFF" style="stroke:#181818;stroke-width:1.5;" rx="12.5" ry="12.5"/><text x="1047.429" y="353.804" fill="#000" font-size="15" textLength="198.618" font-weight="700" font-family="Arial">PLEDGE 4 BƯỚC - B06-B10</text><text x="1047.429" y="371.052" fill="#000" font-size="15" textLength="209.568" font-family="Arial">• Reward hoặc không nhận quà</text><text x="1047.429" y="388.301" fill="#000" font-size="15" textLength="239.546" font-family="Arial">• Add-on, địa chỉ Việt Nam, shipping</text><text x="1047.429" y="405.549" fill="#000" font-size="15" textLength="212.864" font-family="Arial">• Kiểm tra tổng tiền và authorize</text><path d="M987.429,374.231 L997.429,374.231 C1012.429,374.231 1012.429,374.231 1027.429,374.231 L1037.429,374.231" style="stroke:#5A6C64;stroke-width:1;" fill="none"/><rect x="1037.429" y="438.728" width="332.063" height="88.994" fill="#FFF" style="stroke:#181818;stroke-width:1.5;" rx="12.5" ry="12.5"/><text x="1047.429" y="462.798" fill="#000" font-size="15" textLength="199.197" font-weight="700" font-family="Arial">SAU KHI ỦNG HỘ - B11-B16</text><text x="1047.429" y="480.046" fill="#000" font-size="15" textLength="249.58" font-family="Arial">• Đặt câu hỏi, đọc phản hồi của nhóm</text><text x="1047.429" y="497.295" fill="#000" font-size="15" textLength="237.854" font-family="Arial">• Backed, Saved, Following, Activity</text><text x="1047.429" y="514.543" fill="#000" font-size="15" textLength="312.063" font-family="Arial">• Pledge ID nối Backer → Creator → ngày chốt</text><path d="M987.429,374.231 L997.429,374.231 C1012.429,374.231 1012.429,483.225 1027.429,483.225 L1037.429,483.225" style="stroke:#5A6C64;stroke-width:1;" fill="none"/><path d="M853.262,491.849 L863.262,491.849 C878.262,491.849 878.262,374.231 893.262,374.231 L903.262,374.231" style="stroke:#5A6C64;stroke-width:1;" fill="none"/><rect x="903.262" y="737.086" width="94.165" height="37.249" fill="#FBE7DF" style="stroke:#181818;stroke-width:1.5;" rx="12.5" ry="12.5"/><text x="913.262" y="761.156" fill="#000" font-size="15" textLength="74.165" font-weight="700" font-family="Arial">CREATOR</text><rect x="1047.427" y="547.722" width="346.111" height="88.994" fill="#FFF" style="stroke:#181818;stroke-width:1.5;" rx="12.5" ry="12.5"/><text x="1057.427" y="571.792" fill="#000" font-size="15" textLength="208.367" font-weight="700" font-family="Arial">SOẠN CHIẾN DỊCH - C01-C06</text><text x="1057.427" y="589.041" fill="#000" font-size="15" textLength="262.852" font-family="Arial">• Draft, Story, ảnh minh họa mẫu, Risks</text><text x="1057.427" y="606.289" fill="#000" font-size="15" textLength="301.267" font-family="Arial">• Goal 15-60 ngày, Reward, Add-on, shipping</text><text x="1057.427" y="623.538" fill="#000" font-size="15" textLength="326.111" font-family="Arial">• Mời và phân quyền Collaborator theo campaign</text><path d="M997.427,755.71 L1007.427,755.71 C1022.427,755.71 1022.427,592.219 1037.427,592.219 L1047.427,592.219" style="stroke:#5A6C64;stroke-width:1;" fill="none"/><rect x="1047.427" y="656.716" width="297.068" height="88.994" fill="#FFF" style="stroke:#181818;stroke-width:1.5;" rx="12.5" ry="12.5"/><text x="1057.427" y="680.786" fill="#000" font-size="15" textLength="229.438" font-weight="700" font-family="Arial">DỰ BÁO &amp; VÒNG ĐỜI - C07-C12</text><text x="1057.427" y="698.035" fill="#000" font-size="15" textLength="206.169" font-family="Arial">• Success Prediction và factors</text><text x="1057.427" y="715.283" fill="#000" font-size="15" textLength="259.622" font-family="Arial">• Gửi duyệt, nhận phản hồi, Pre-launch</text><text x="1057.427" y="732.532" fill="#000" font-size="15" textLength="277.068" font-family="Arial">• Launch, funding metric và live prediction</text><path d="M997.427,755.71 L1007.427,755.71 C1022.427,755.71 1022.427,701.213 1037.427,701.213 L1047.427,701.213" style="stroke:#5A6C64;stroke-width:1;" fill="none"/><rect x="1047.427" y="765.71" width="305.271" height="88.994" fill="#FFF" style="stroke:#181818;stroke-width:1.5;" rx="12.5" ry="12.5"/><text x="1057.427" y="789.78" fill="#000" font-size="15" textLength="152.527" font-weight="700" font-family="Arial">VẬN HÀNH - C13-C15</text><text x="1057.427" y="807.029" fill="#000" font-size="15" textLength="285.271" font-family="Arial">• Trả lời hoặc giao câu hỏi đúng thành viên</text><text x="1057.427" y="824.277" fill="#000" font-size="15" textLength="225.19" font-family="Arial">• Giao quà chỉ mở sau Successful</text><text x="1057.427" y="841.526" fill="#000" font-size="15" textLength="285.22" font-family="Arial">• Task/handoff nối Creator với Collaborator</text><path d="M997.427,755.71 L1007.427,755.71 C1022.427,755.71 1022.427,810.208 1037.427,810.208 L1047.427,810.208" style="stroke:#5A6C64;stroke-width:1;" fill="none"/><rect x="1047.427" y="874.705" width="333.711" height="88.994" fill="#FFF" style="stroke:#181818;stroke-width:1.5;" rx="12.5" ry="12.5"/><text x="1057.427" y="898.774" fill="#000" font-size="15" textLength="220.869" font-weight="700" font-family="Arial">SAU CORE - EXT-C01-EXT-C03</text><text x="1057.427" y="916.023" fill="#000" font-size="15" textLength="266.931" font-family="Arial">• Hỗ trợ rà tiêu đề và nội dung bản nháp</text><text x="1057.427" y="933.271" fill="#000" font-size="15" textLength="245.383" font-family="Arial">• Gom chủ đề/cảm xúc của bình luận</text><text x="1057.427" y="950.52" fill="#000" font-size="15" textLength="313.711" font-family="Arial">• Quick Reply chỉ điền nháp, người dùng tự gửi</text><path d="M997.427,755.71 L1007.427,755.71 C1022.427,755.71 1022.427,919.202 1037.427,919.202 L1047.427,919.202" style="stroke:#5A6C64;stroke-width:1;" fill="none"/><path d="M853.262,491.849 L863.262,491.849 C878.262,491.849 878.262,755.71 893.262,755.71 L903.262,755.71" style="stroke:#5A6C64;stroke-width:1;" fill="none"/><rect x="397.944" y="200.74" width="147.485" height="37.249" fill="#EEE9F8" style="stroke:#181818;stroke-width:1.5;" rx="12.5" ry="12.5"/><text x="407.944" y="224.81" fill="#000" font-size="15" textLength="127.485" font-weight="700" font-family="Arial">COLLABORATOR</text><rect x="22.466" y="111.746" width="325.479" height="88.994" fill="#FFF" style="stroke:#181818;stroke-width:1.5;" rx="12.5" ry="12.5"/><text x="32.466" y="135.815" fill="#000" font-size="15" textLength="225.857" font-weight="700" font-family="Arial">QUYỀN THEO CAMPAIGN - C06</text><text x="32.466" y="153.064" fill="#000" font-size="15" textLength="269.246" font-family="Arial">• Được Creator mời vào đúng chiến dịch</text><text x="32.466" y="170.313" fill="#000" font-size="15" textLength="269.612" font-family="Arial">• Quyền tách: update, reply, xem dự báo</text><text x="32.466" y="187.561" fill="#000" font-size="15" textLength="305.479" font-family="Arial">• Không có quyền launch, phí hoặc thành viên</text><path d="M397.944,219.364 L387.944,219.364 C372.944,219.364 372.944,156.243 357.944,156.243 L347.944,156.243" style="stroke:#5A6C64;stroke-width:1;" fill="none"/><rect x="10.352" y="220.74" width="337.593" height="106.243" fill="#FFF" style="stroke:#181818;stroke-width:1.5;" rx="12.5" ry="12.5"/><text x="20.352" y="244.81" fill="#000" font-size="15" textLength="181.692" font-weight="700" font-family="Arial">BÀN LÀM VIỆC - C12-C14</text><text x="20.352" y="262.058" fill="#000" font-size="15" textLength="266.111" font-family="Arial">• Xem task, câu hỏi được giao, deadline</text><text x="20.352" y="279.307" fill="#000" font-size="15" textLength="268.799" font-family="Arial">• Thông báo trong app, đánh dấu đã đọc</text><text x="20.352" y="296.555" fill="#000" font-size="15" textLength="163.674" font-family="Arial">• Theo dõi live prediction</text><text x="20.352" y="313.804" fill="#000" font-size="15" textLength="317.593" font-family="Arial">• Cập nhật quay về Creator trước khi tới Backer</text><path d="M397.944,219.364 L387.944,219.364 C372.944,219.364 372.944,273.861 357.944,273.861 L347.944,273.861" style="stroke:#5A6C64;stroke-width:1;" fill="none"/><path d="M595.43,491.849 L585.43,491.849 C570.43,491.849 570.43,219.364 555.43,219.364 L545.43,219.364" style="stroke:#5A6C64;stroke-width:1;" fill="none"/><rect x="476.27" y="481.849" width="69.16" height="37.249" fill="#F4E8E6" style="stroke:#181818;stroke-width:1.5;" rx="12.5" ry="12.5"/><text x="486.27" y="505.919" fill="#000" font-size="15" textLength="49.16" font-weight="700" font-family="Arial">ADMIN</text><rect x="132.915" y="346.982" width="293.354" height="88.994" fill="#FFF" style="stroke:#181818;stroke-width:1.5;" rx="12.5" ry="12.5"/><text x="142.915" y="371.052" fill="#000" font-size="15" textLength="165.864" font-weight="700" font-family="Arial">KIỂM DUYỆT - A01-A04</text><text x="142.915" y="388.301" fill="#000" font-size="15" textLength="220.195" font-family="Arial">• Hàng chờ, version, tài liệu, SLA</text><text x="142.915" y="405.549" fill="#000" font-size="15" textLength="174.551" font-family="Arial">• Checklist và bằng chứng</text><text x="142.915" y="422.798" fill="#000" font-size="15" textLength="273.354" font-family="Arial">• Kết quả + lý do quay về đúng campaign</text><path d="M476.27,500.474 L466.27,500.474 C451.27,500.474 451.27,391.479 436.27,391.479 L426.27,391.479" style="stroke:#5A6C64;stroke-width:1;" fill="none"/><rect x="182.537" y="455.977" width="243.733" height="88.994" fill="#FFF" style="stroke:#181818;stroke-width:1.5;" rx="12.5" ry="12.5"/><text x="192.537" y="480.046" fill="#000" font-size="15" textLength="188.364" font-weight="700" font-family="Arial">VẬN HÀNH SÀN - A05-A07</text><text x="192.537" y="497.295" fill="#000" font-size="15" textLength="208.411" font-family="Arial">• Khóa/mở người dùng có lý do</text><text x="192.537" y="514.543" fill="#000" font-size="15" textLength="209.568" font-family="Arial">• Dòng vốn, doanh thu, đối soát</text><text x="192.537" y="531.792" fill="#000" font-size="15" textLength="223.733" font-family="Arial">• Phí nền tảng và nhật ký thay đổi</text><path d="M476.27,500.474 L466.27,500.474 C451.27,500.474 451.27,500.474 436.27,500.474 L426.27,500.474" style="stroke:#5A6C64;stroke-width:1;" fill="none"/><rect x="102.461" y="564.971" width="323.809" height="88.994" fill="#FFF" style="stroke:#181818;stroke-width:1.5;" rx="12.5" ry="12.5"/><text x="112.461" y="589.041" fill="#000" font-size="15" textLength="189.192" font-weight="700" font-family="Arial">FRAUD REVIEW - A08-A10</text><text x="112.461" y="606.289" fill="#000" font-size="15" textLength="176.829" font-family="Arial">• Hàng chờ theo risk score</text><text x="112.461" y="623.538" fill="#000" font-size="15" textLength="291.299" font-family="Arial">• Signals/evidence đã che dữ liệu nhạy cảm</text><text x="112.461" y="640.786" fill="#000" font-size="15" textLength="303.809" font-family="Arial">• Clear hoặc Escalate, không tự khóa bằng AI</text><path d="M476.27,500.474 L466.27,500.474 C451.27,500.474 451.27,609.468 436.27,609.468 L426.27,609.468" style="stroke:#5A6C64;stroke-width:1;" fill="none"/><path d="M595.43,491.849 L585.43,491.849 C570.43,491.849 570.43,500.474 555.43,500.474 L545.43,500.474" style="stroke:#5A6C64;stroke-width:1;" fill="none"/><rect x="382.922" y="754.335" width="162.507" height="37.249" fill="#EEF1EF" style="stroke:#181818;stroke-width:1.5;" rx="12.5" ry="12.5"/><text x="392.922" y="778.405" fill="#000" font-size="15" textLength="142.507" font-weight="700" font-family="Arial">SYSTEM / WORKER</text><rect x="10.996" y="673.965" width="321.926" height="88.994" fill="#FFF" style="stroke:#181818;stroke-width:1.5;" rx="12.5" ry="12.5"/><text x="20.996" y="698.035" fill="#000" font-size="15" textLength="167.483" font-weight="700" font-family="Arial">DỮ LIỆU &amp; AI - S01-S03</text><text x="20.996" y="715.283" fill="#000" font-size="15" textLength="286.912" font-family="Arial">• Tổng hợp metric và interaction hằng ngày</text><text x="20.996" y="732.532" fill="#000" font-size="15" textLength="237.876" font-family="Arial">• Chạy live prediction cho campaign</text><text x="20.996" y="749.78" fill="#000" font-size="15" textLength="301.926" font-family="Arial">• Chấm fraud score và tạo evidence tổng hợp</text><path d="M382.922,772.959 L372.922,772.959 C357.922,772.959 357.922,718.462 342.922,718.462 L332.922,718.462" style="stroke:#5A6C64;stroke-width:1;" fill="none"/><rect x="10" y="782.959" width="322.922" height="88.994" fill="#FFF" style="stroke:#181818;stroke-width:1.5;" rx="12.5" ry="12.5"/><text x="20" y="807.029" fill="#000" font-size="15" textLength="200.032" font-weight="700" font-family="Arial">CHỐT CAMPAIGN - S04-S08</text><text x="20" y="824.277" fill="#000" font-size="15" textLength="252.898" font-family="Arial">• Đạt Goal: capture; không đạt: cancel</text><text x="20" y="841.526" fill="#000" font-size="15" textLength="302.922" font-family="Arial">• Webhook idempotent theo provider event ID</text><text x="20" y="858.774" fill="#000" font-size="15" textLength="262.976" font-family="Arial">• Gửi thông báo kết quả và lỗi cần xử lý</text><path d="M382.922,772.959 L372.922,772.959 C357.922,772.959 357.922,827.456 342.922,827.456 L332.922,827.456" style="stroke:#5A6C64;stroke-width:1;" fill="none"/><path d="M595.43,491.849 L585.43,491.849 C570.43,491.849 570.43,772.959 555.43,772.959 L545.43,772.959" style="stroke:#5A6C64;stroke-width:1;" fill="none"/><?plantuml-src TLTRRnl75NxNhpY0WJwaouYKTQjh65akbn8XYL98IexHz66uE-HEkRSkPtNfa-G03jh0Q6GdI5Ctg6J1JTDQJLotACf5aeSLyZysloHdPdQbrSL-Y9cTstU-yttd7BypvYJY7lDjZuHJun7pGn8H3_h46WsZ8FPj8t2326urwqszEL_QOTC1YLtU37pU9Xu5FMB4lNczotv7eJPNMXmxn0vsc3-40N77jBIYHr6maxyvfyyRyxEbnLNcqvx3h95FnsEebLRymAPZ6i9CUNj4_97yk3WrjeXBmIExC3DJhS8EixapzTQlRjNcRi_Dr7yDTotnv9rRJVddtjt-lQNqwSRTwVwzkzDowTxx_fKzHlhm0HZBMV9t0zfd3zjBq5isrs5BRq6lapufpaszXS-O2yrgSnwVmNitpMvFN8mBkA8kaoiho-d16cpWVy58Fy7xLfRnhWeiLMkLfUfjSUPz_yVzvz33m8PWELdo9ModH_YBPPFlVR2pv2FB0JzBFcNGpoQdFD-VllHW9FPu6bY4qs4GxScJ_Ipv7DmiUMofdHjHy1jgSMXGJfWBPuVYYGNWf7yDRI_TRo72zMpol2r1pYB8kGkGPn-VVO0eH-ctK4SnqGYyRF8_IzxvaUzSskGx23RKS4t-xswSJLvm3KPE-Xy68SRvmXA