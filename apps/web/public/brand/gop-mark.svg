  <path d="M12 33h40" stroke="#c95339" stroke-width="3" stroke-linecap="round"/>
  <text x="32" y="55" text-anchor="middle" fill="#17392f" font-family="Arial,sans-serif" font-size="22" font-weight="800" letter-spacing="-1">NT</text>
