<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="MINDMAP" style="width:1574px;height:801px;background:#FBFAF6;" width="1574px" height="801px" viewBox="0 0 1574 801" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="1574" height="801" fill="#FBFAF6" style="stroke:none;"/><rect x="648.772" y="372.855" width="357.852" height="54.497" fill="#15352B" style="stroke:#181818;stroke-width:1.5;" rx="12.5" ry="12.5"/><text x="658.772" y="396.925" fill="#FFF" font-size="15" textLength="33.34" font-weight="700" font-family="Arial">GÓP</text><text x="658.772" y="414.174" fill="#FFF" font-size="15" textLength="337.852" font-family="Arial">CÂY YÊU CẦU PHI CHỨC NĂNG THEO VAI TRÒ</text><rect x="1056.624" y="108.994" width="71.672" height="37.249" fill="#E7F0F6" style="stroke:#181818;stroke-width:1.5;" rx="12.5" ry="12.5"/><text x="1066.624" y="133.064" fill="#000" font-size="15" textLength="51.672" font-weight="700" font-family="Arial">GUEST</text><rect x="1178.296" y="28.624" width="304.465" height="88.994" fill="#FFF" style="stroke:#181818;stroke-width:1.5;" rx="12.5" ry="12.5"/><text x="1188.296" y="52.694" fill="#000" font-size="15" textLength="251.902" font-weight="700" font-family="Arial">TÌM THẤY &amp; ĐỌC ĐƯỢC - NFR-G01</text><text x="1188.296" y="69.943" fill="#000" font-size="15" textLength="199.534" font-family="Arial">• Metadata rõ cho trang public</text><text x="1188.296" y="87.191" fill="#000" font-size="15" textLength="269.604" font-family="Arial">• Nội dung chính dùng semantic heading</text><text x="1188.296" y="104.44" fill="#000" font-size="15" textLength="284.465" font-family="Arial">• Ảnh có alt; bàn phím đi được luồng chính</text><path d="M1128.296,127.618 L1138.296,127.618 C1153.296,127.618 1153.296,73.121 1168.296,73.121 L1178.296,73.121" style="stroke:#5A6C64;stroke-width:1;" fill="none"/><rect x="1178.296" y="137.618" width="262.117" height="88.994" fill="#FFF" style="stroke:#181818;stroke-width:1.5;" rx="12.5" ry="12.5"/><text x="1188.296" y="161.688" fill="#000" font-size="15" textLength="219.163" font-weight="700" font-family="Arial">NHANH &amp; AN TOÀN - NFR-G02</text><text x="1188.296" y="178.937" fill="#000" font-size="15" textLength="202.874" font-family="Arial">• LCP public target &lt;= 2,5 giây</text><text x="1188.296" y="196.185" fill="#000" font-size="15" textLength="235.422" font-family="Arial">• Chỉ lộ dữ liệu campaign công khai</text><text x="1188.296" y="213.434" fill="#000" font-size="15" textLength="242.117" font-family="Arial">• 390/768/1440 px không tràn ngang</text><path d="M1128.296,127.618 L1138.296,127.618 C1153.296,127.618 1153.296,182.115 1168.296,182.115 L1178.296,182.115" style="stroke:#5A6C64;stroke-width:1;" fill="none"/><path d="M1006.624,400.104 L1016.624,400.104 C1031.624,400.104 1031.624,127.618 1046.624,127.618 L1056.624,127.618" style="stroke:#5A6C64;stroke-width:1;" fill="none"/><rect x="1056.624" y="326.982" width="84.167" height="37.249" fill="#E8F1D8" style="stroke:#181818;stroke-width:1.5;" rx="12.5" ry="12.5"/><text x="1066.624" y="351.052" fill="#000" font-size="15" textLength="64.167" font-weight="700" font-family="Arial">BACKER</text><rect x="1190.791" y="246.613" width="331.272" height="88.994" fill="#FFF" style="stroke:#181818;stroke-width:1.5;" rx="12.5" ry="12.5"/><text x="1200.791" y="270.682" fill="#000" font-size="15" textLength="239.993" font-weight="700" font-family="Arial">TIN CẬY THANH TOÁN - NFR-B01</text><text x="1200.791" y="287.931" fill="#000" font-size="15" textLength="276.709" font-family="Arial">• AUTHORIZED = giữ hạn mức, chưa thu</text><text x="1200.791" y="305.179" fill="#000" font-size="15" textLength="180.168" font-family="Arial">• Tổng tiền tính lại ở server</text><text x="1200.791" y="322.428" fill="#000" font-size="15" textLength="311.272" font-family="Arial">• Một pledge/campaign/backer và snapshot giá</text><path d="M1140.791,345.607 L1150.791,345.607 C1165.791,345.607 1165.791,291.11 1180.791,291.11 L1190.791,291.11" style="stroke:#5A6C64;stroke-width:1;" fill="none"/><rect x="1190.791" y="355.607" width="362.957" height="88.994" fill="#FFF" style="stroke:#181818;stroke-width:1.5;" rx="12.5" ry="12.5"/><text x="1200.791" y="379.677" fill="#000" font-size="15" textLength="238.286" font-weight="700" font-family="Arial">DỄ DÙNG &amp; RIÊNG TƯ - NFR-B02</text><text x="1200.791" y="396.925" fill="#000" font-size="15" textLength="280.393" font-family="Arial">• Validation theo từng bước, giữ bản nhập</text><text x="1200.791" y="414.174" fill="#000" font-size="15" textLength="263.716" font-family="Arial">• Địa chỉ chỉ Việt Nam, che thông tin thẻ</text><text x="1200.791" y="431.422" fill="#000" font-size="15" textLength="342.957" font-family="Arial">• Draft tin nhắn và tab không mất khi chuyển qua lại</text><path d="M1140.791,345.607 L1150.791,345.607 C1165.791,345.607 1165.791,400.104 1180.791,400.104 L1190.791,400.104" style="stroke:#5A6C64;stroke-width:1;" fill="none"/><path d="M1006.624,400.104 L1016.624,400.104 C1031.624,400.104 1031.624,345.607 1046.624,345.607 L1056.624,345.607" style="stroke:#5A6C64;stroke-width:1;" fill="none"/><rect x="1056.624" y="599.468" width="94.165" height="37.249" fill="#FBE7DF" style="stroke:#181818;stroke-width:1.5;" rx="12.5" ry="12.5"/><text x="1066.624" y="623.538" fill="#000" font-size="15" textLength="74.165" font-weight="700" font-family="Arial">CREATOR</text><rect x="1200.789" y="464.601" width="291.318" height="88.994" fill="#FFF" style="stroke:#181818;stroke-width:1.5;" rx="12.5" ry="12.5"/><text x="1210.789" y="488.671" fill="#000" font-size="15" textLength="258.281" font-weight="700" font-family="Arial">SOẠN DỮ LIỆU AN TOÀN - NFR-C01</text><text x="1210.789" y="505.919" fill="#000" font-size="15" textLength="271.318" font-family="Arial">• Có lưu nháp và phản hồi thành công/lỗi</text><text x="1210.789" y="523.168" fill="#000" font-size="15" textLength="242.717" font-family="Arial">• Giới hạn độ dài, tiền VND, duration</text><text x="1210.789" y="540.416" fill="#000" font-size="15" textLength="217.91" font-family="Arial">• Ảnh tối ưu và có mô tả thay thế</text><path d="M1150.789,618.092 L1160.789,618.092 C1175.789,618.092 1175.789,509.098 1190.789,509.098 L1200.789,509.098" style="stroke:#5A6C64;stroke-width:1;" fill="none"/><rect x="1200.789" y="573.595" width="347.107" height="88.994" fill="#FFF" style="stroke:#181818;stroke-width:1.5;" rx="12.5" ry="12.5"/><text x="1210.789" y="597.665" fill="#000" font-size="15" textLength="227.739" font-weight="700" font-family="Arial">AI GIẢI THÍCH ĐƯỢC - NFR-C02</text><text x="1210.789" y="614.913" fill="#000" font-size="15" textLength="247.888" font-family="Arial">• Có model version và input snapshot</text><text x="1210.789" y="632.162" fill="#000" font-size="15" textLength="327.107" font-family="Arial">• Probability đi cùng factors, không nói chắc chắn</text><text x="1210.789" y="649.41" fill="#000" font-size="15" textLength="309.492" font-family="Arial">• Không biến dự báo thành lời cam kết kết quả</text><path d="M1150.789,618.092 L1160.789,618.092 C1175.789,618.092 1175.789,618.092 1190.789,618.092 L1200.789,618.092" style="stroke:#5A6C64;stroke-width:1;" fill="none"/><rect x="1200.789" y="682.589" width="332.729" height="88.994" fill="#FFF" style="stroke:#181818;stroke-width:1.5;" rx="12.5" ry="12.5"/><text x="1210.789" y="706.659" fill="#000" font-size="15" textLength="246.965" font-weight="700" font-family="Arial">TRỢ LÝ CÓ KIỂM SOÁT - NFR-C03</text><text x="1210.789" y="723.907" fill="#000" font-size="15" textLength="224.956" font-family="Arial">• Prompt version + input snapshot</text><text x="1210.789" y="741.156" fill="#000" font-size="15" textLength="312.729" font-family="Arial">• Nội dung người dùng luôn được coi là dữ liệu</text><text x="1210.789" y="758.405" fill="#000" font-size="15" textLength="256.772" font-family="Arial">• Gợi ý chỉ điền nháp, cần người duyệt</text><path d="M1150.789,618.092 L1160.789,618.092 C1175.789,618.092 1175.789,727.086 1190.789,727.086 L1200.789,727.086" style="stroke:#5A6C64;stroke-width:1;" fill="none"/><path d="M1006.624,400.104 L1016.624,400.104 C1031.624,400.104 1031.624,618.092 1046.624,618.092 L1056.624,618.092" style="stroke:#5A6C64;stroke-width:1;" fill="none"/><rect x="451.287" y="108.994" width="147.485" height="37.249" fill="#EEE9F8" style="stroke:#181818;stroke-width:1.5;" rx="12.5" ry="12.5"/><text x="461.287" y="133.064" fill="#000" font-size="15" textLength="127.485" font-weight="700" font-family="Arial">COLLABORATOR</text><rect x="71.648" y="20" width="329.639" height="88.994" fill="#FFF" style="stroke:#181818;stroke-width:1.5;" rx="12.5" ry="12.5"/><text x="81.648" y="44.07" fill="#000" font-size="15" textLength="220.012" font-weight="700" font-family="Arial">QUYỀN TỐI THIỂU - NFR-CO01</text><text x="81.648" y="61.318" fill="#000" font-size="15" textLength="277.075" font-family="Arial">• Kiểm tra quyền tại API, không chỉ ẩn nút</text><text x="81.648" y="78.567" fill="#000" font-size="15" textLength="282.517" font-family="Arial">• Giao câu hỏi theo campaign_id + user_id</text><text x="81.648" y="95.815" fill="#000" font-size="15" textLength="309.639" font-family="Arial">• Badge phản ánh đúng vai trò trong campaign</text><path d="M451.287,127.618 L441.287,127.618 C426.287,127.618 426.287,64.497 411.287,64.497 L401.287,64.497" style="stroke:#5A6C64;stroke-width:1;" fill="none"/><rect x="72.117" y="128.994" width="329.17" height="106.243" fill="#FFF" style="stroke:#181818;stroke-width:1.5;" rx="12.5" ry="12.5"/><text x="82.117" y="153.064" fill="#000" font-size="15" textLength="189.478" font-weight="700" font-family="Arial">PHỐI HỢP RÕ - NFR-CO02</text><text x="82.117" y="170.313" fill="#000" font-size="15" textLength="282.788" font-family="Arial">• Task/câu hỏi có người nhận và trạng thái</text><text x="82.117" y="187.561" fill="#000" font-size="15" textLength="309.17" font-family="Arial">• Câu hỏi giao lại tạo lượt đọc mới đúng người</text><text x="82.117" y="204.81" fill="#000" font-size="15" textLength="203.54" font-family="Arial">• Bàn giao để lại mốc thời gian</text><text x="82.117" y="222.058" fill="#000" font-size="15" textLength="268.792" font-family="Arial">• Thao tác lỗi vẫn giữ nội dung đang làm</text><path d="M451.287,127.618 L441.287,127.618 C426.287,127.618 426.287,182.115 411.287,182.115 L401.287,182.115" style="stroke:#5A6C64;stroke-width:1;" fill="none"/><path d="M648.772,400.104 L638.772,400.104 C623.772,400.104 623.772,127.618 608.772,127.618 L598.772,127.618" style="stroke:#5A6C64;stroke-width:1;" fill="none"/><rect x="529.612" y="335.607" width="69.16" height="37.249" fill="#F4E8E6" style="stroke:#181818;stroke-width:1.5;" rx="12.5" ry="12.5"/><text x="539.612" y="359.677" fill="#000" font-size="15" textLength="49.16" font-weight="700" font-family="Arial">ADMIN</text><rect x="159.634" y="255.237" width="319.978" height="88.994" fill="#FFF" style="stroke:#181818;stroke-width:1.5;" rx="12.5" ry="12.5"/><text x="169.634" y="279.307" fill="#000" font-size="15" textLength="299.978" font-weight="700" font-family="Arial">AUDIT &amp; HUMAN-IN-THE-LOOP - NFR-A01</text><text x="169.634" y="296.555" fill="#000" font-size="15" textLength="297.063" font-family="Arial">• Quyết định luôn có admin, lý do, timestamp</text><text x="169.634" y="313.804" fill="#000" font-size="15" textLength="242.922" font-family="Arial">• Fraud score chỉ xếp thứ tự xem xét</text><text x="169.634" y="331.052" fill="#000" font-size="15" textLength="212.058" font-family="Arial">• Không công khai IP/device thô</text><path d="M529.612,354.231 L519.612,354.231 C504.612,354.231 504.612,299.734 489.612,299.734 L479.612,299.734" style="stroke:#5A6C64;stroke-width:1;" fill="none"/><rect x="178.34" y="364.231" width="301.272" height="88.994" fill="#FFF" style="stroke:#181818;stroke-width:1.5;" rx="12.5" ry="12.5"/><text x="188.34" y="388.301" fill="#000" font-size="15" textLength="223.337" font-weight="700" font-family="Arial">VẬN HÀNH ỔN ĐỊNH - NFR-A02</text><text x="188.34" y="405.549" fill="#000" font-size="15" textLength="256.238" font-family="Arial">• Review có SLA và trạng thái quá hạn</text><text x="188.34" y="422.798" fill="#000" font-size="15" textLength="261.248" font-family="Arial">• Đối soát payment có mốc chốt dữ liệu</text><text x="188.34" y="440.046" fill="#000" font-size="15" textLength="281.272" font-family="Arial">• Bộ lọc, form và quyết định giữ khi đổi tab</text><path d="M529.612,354.231 L519.612,354.231 C504.612,354.231 504.612,408.728 489.612,408.728 L479.612,408.728" style="stroke:#5A6C64;stroke-width:1;" fill="none"/><path d="M648.772,400.104 L638.772,400.104 C623.772,400.104 623.772,354.231 608.772,354.231 L598.772,354.231" style="stroke:#5A6C64;stroke-width:1;" fill="none"/><rect x="434.602" y="608.092" width="164.17" height="37.249" fill="#EEF1EF" style="stroke:#181818;stroke-width:1.5;" rx="12.5" ry="12.5"/><text x="444.602" y="632.162" fill="#000" font-size="15" textLength="144.17" font-weight="700" font-family="Arial">SHARED / WORKER</text><rect x="10" y="473.225" width="374.602" height="88.994" fill="#FFF" style="stroke:#181818;stroke-width:1.5;" rx="12.5" ry="12.5"/><text x="20" y="497.295" fill="#000" font-size="15" textLength="154.175" font-weight="700" font-family="Arial">NỀN TẢNG - NFR-S01</text><text x="20" y="514.543" fill="#000" font-size="15" textLength="354.602" font-family="Arial">• Next.js deploy Vercel, không phụ thuộc disk runtime</text><text x="20" y="531.792" fill="#000" font-size="15" textLength="257.036" font-family="Arial">• UI chỉ phụ thuộc PlatformApi contract</text><text x="20" y="549.041" fill="#000" font-size="15" textLength="288.508" font-family="Arial">• VND, vi-VN và múi giờ Asia/Ho_Chi_Minh</text><path d="M434.602,626.716 L424.602,626.716 C409.602,626.716 409.602,517.722 394.602,517.722 L384.602,517.722" style="stroke:#5A6C64;stroke-width:1;" fill="none"/><rect x="20.847" y="582.219" width="363.755" height="88.994" fill="#FFF" style="stroke:#181818;stroke-width:1.5;" rx="12.5" ry="12.5"/><text x="30.847" y="606.289" fill="#000" font-size="15" textLength="263.35" font-weight="700" font-family="Arial">RELIABILITY &amp; SECURITY - NFR-S02</text><text x="30.847" y="623.538" fill="#000" font-size="15" textLength="280.195" font-family="Arial">• RBAC, validate input, secret chỉ ở server</text><text x="30.847" y="640.786" fill="#000" font-size="15" textLength="291.907" font-family="Arial">• Webhook/job idempotent, retry có giới hạn</text><text x="30.847" y="658.035" fill="#000" font-size="15" textLength="343.755" font-family="Arial">• Loading/empty/error/fallback cho API, AI, payment</text><path d="M434.602,626.716 L424.602,626.716 C409.602,626.716 409.602,626.716 394.602,626.716 L384.602,626.716" style="stroke:#5A6C64;stroke-width:1;" fill="none"/><rect x="85.872" y="691.213" width="298.73" height="88.994" fill="#FFF" style="stroke:#181818;stroke-width:1.5;" rx="12.5" ry="12.5"/><text x="95.872" y="715.283" fill="#000" font-size="15" textLength="187.507" font-weight="700" font-family="Arial">QUALITY GATE - NFR-S03</text><text x="95.872" y="732.532" fill="#000" font-size="15" textLength="265.4" font-family="Arial">• TypeScript + ESLint + production build</text><text x="95.872" y="749.78" fill="#000" font-size="15" textLength="229.556" font-family="Arial">• E2E hai nhánh Successful/Failed</text><text x="95.872" y="767.029" fill="#000" font-size="15" textLength="278.73" font-family="Arial">• Test desktop, tablet, mobile và keyboard</text><path d="M434.602,626.716 L424.602,626.716 C409.602,626.716 409.602,735.71 394.602,735.71 L384.602,735.71" style="stroke:#5A6C64;stroke-width:1;" fill="none"/><path d="M648.772,400.104 L638.772,400.104 C623.772,400.104 623.772,626.716 608.772,626.716 L598.772,626.716" style="stroke:#5A6C64;stroke-width:1;" fill="none"/><?plantuml-