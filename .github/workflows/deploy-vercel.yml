name: Auto Deploy Vercel (Backend & Frontend)

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      target:
        description: "Dịch vụ cần triển khai (auto = tự phát hiện thay đổi, all = cả hai, backend, frontend)"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - auto
          - backend
          - frontend

concurrency:
  group: vercel-deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Auto-Deploy lên Vercel
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout mã nguồn (kèm lịch sử diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Cài đặt pnpm
        uses: pnpm/action-setup@v4

      - name: Cài đặt Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Cài đặt gói phụ thuộc workspace
        run: pnpm install --frozen-lockfile

      - name: Kiểm tra Type-Check & Lint trước khi phát hành
        run: |
          pnpm type-check
          pnpm lint

      - name: Cài đặt Vercel CLI cố định
        run: npm install --global vercel@48.12.1

      - name: Tự động nhận diện thay đổi & Deploy lên Vercel
        id: vercel_deploy
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_BACKEND_PROJECT_ID: ${{ secrets.VERCEL_BACKEND_PROJECT_ID }}
          VERCEL_FRONTEND_PROJECT_ID: ${{ secrets.VERCEL_FRONTEND_PROJECT_ID }}
          VERCEL_BACKEND_DEPLOY_HOOK: ${{ secrets.VERCEL_BACKEND_DEPLOY_HOOK }}
          VERCEL_FRONTEND_DEPLOY_HOOK: ${{ secrets.VERCEL_FRONTEND_DEPLOY_HOOK }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          DEPLOY_ENV="preview"
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            DEPLOY_ENV="production"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            DEPLOY_ENV="production"
          fi

          DEPLOY_TARGET="${{ github.event.inputs.target }}"
          if [ -z "$DEPLOY_TARGET" ]; then
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              DEPLOY_TARGET="all"
            else
              DEPLOY_TARGET="auto"
            fi
          fi

          node .github/scripts/vercel-deploy.mjs --target="$DEPLOY_TARGET" --env="$DEPLOY_ENV"

      - name: Bình luận link Preview tự động lên Pull Request
        if: github.event_name == 'pull_request' && steps.vercel_deploy.outputs.frontend_url != ''
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              '### 🚀 Bản xem trước Vercel (Auto-Deploy Preview)',
              `- **Frontend Web:** ${{ steps.vercel_deploy.outputs.frontend_url }}`,
              `- **Backend API:** ${{ steps.vercel_deploy.outputs.backend_url }} ([Health Check](${{ steps.vercel_deploy.outputs.backend_url }}/api/v1/health))`,
              `_Tự động cập nhật từ commit \`${context.sha.slice(0, 7)}\`_`
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const marker = 'Bản xem trước Vercel (Auto-Deploy Preview)';
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
